<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><meta name="description" content="Offline all-time fantasy football auction tracker">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Football Draft Tracker</title>
<style>
:root{--navy:#102a43;--blue:#1769aa;--bg:#f1f5f9;--card:#fff;--text:#102a43;--muted:#64748b;--line:#cbd5e1;--good:#166534;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}header h1{font-size:20px;margin:0}header p{font-size:12px;margin:4px 0 0;color:#dbeafe}.wrap{max-width:760px;margin:auto;padding:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 2px #0f172a12}.team-card{border:0;text-align:left;color:inherit;width:100%;cursor:pointer}.team-card.active{outline:3px solid #38bdf8}.team-name{font-weight:800}.money{font-size:20px;font-weight:900;margin-top:5px}.small{font-size:12px;color:var(--muted)}.bad{color:var(--bad)}.good{color:var(--good)}.panel{margin-top:12px}h2{font-size:17px;margin:0 0 10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:8px;background:#f8fafc;border-radius:9px}.metric b{display:block;font-size:16px}.pills{display:flex;flex-wrap:wrap;gap:5px}.pill{font-size:11px;font-weight:700;background:#e0f2fe;color:#075985;border-radius:999px;padding:4px 7px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 5px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.scroll{overflow:auto}button,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border-radius:999px;padding:15px 20px;box-shadow:0 5px 18px #0004}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:30;padding:12px;overflow:auto}.modal.open{display:flex}.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:16px;margin:auto auto 0;width:min(100%,600px)}label,legend{font-size:12px;font-weight:800}input,select{width:100%;padding:11px;border:1px solid #94a3b8;border-radius:9px;background:#fff;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.positions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.pos{border:1px solid var(--line);border-radius:8px;padding:7px 2px;text-align:center;font-size:12px}.pos input{width:auto;margin:0}.notice{font-size:12px;font-weight:700;min-height:18px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.tabs button{white-space:nowrap}.hide{display:none}.cheat-row.sold{opacity:.62}.status{font-size:10px;font-weight:900;border-radius:999px;padding:3px 6px}.available{background:#dcfce7;color:#166534}.soldtag{background:#e2e8f0;color:#475569}.watch{background:#fef3c7;color:#92400e}.cheat-actions{display:flex;gap:5px;flex-wrap:wrap}.cheat-actions .btn{padding:6px 8px;font-size:11px}@media(min-width:600px){.cards{grid-template-columns:repeat(5,1fr)}.fab{right:max(16px,calc((100vw - 760px)/2 + 16px))}}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#334155}.metric{background:#1e293b}input,select{background:#1e293b;color:#fff}.secondary{background:#334155;color:#fff}th,td{border-color:#334155}}
</style></head><body>
<header><h1>All-Time Football Draft</h1><p>£500m · 11 players + manager · offline autosave</p></header>
<main class="wrap"><section id="cards" class="cards"></section><div class="tabs"><button class="btn primary" data-tab="squad">Squad</button><button class="btn secondary" data-tab="rounds">Rounds</button><button class="btn secondary" data-tab="log">All purchases</button><button class="btn secondary" data-tab="cheat">Cheat sheet</button></div><section id="content"></section><section class="panel"><h2>Backup</h2><div class="actions"><button id="export" class="btn secondary">Export</button><button id="import" class="btn secondary">Import</button><button id="reset" class="btn danger">Reset</button></div><input id="importFile" class="hide" type="file" accept="application/json"></section></main>
<button id="add" class="btn primary fab">+ Any purchase</button>
<div id="modal" class="modal" role="dialog" aria-modal="true"><form id="form" class="sheet"><h2>Record any purchase</h2><div class="small" style="margin:-5px 0 10px">Cheat-sheet player or anyone else in football history.</div><div class="grid2"><div class="field"><label>Team<select id="team"></select></label></div><div class="field"><label>Round<input id="round" type="number" min="1" value="1" required></label></div></div><div class="field"><label>Name<input id="name" required maxlength="80" autocomplete="off"></label></div><div class="grid2"><div class="field"><label>Type<select id="type"><option value="player">Player</option><option value="manager">Manager</option></select></label></div><div class="field"><label>Price (£m)<input id="price" type="number" min="1" max="500" required></label></div></div><fieldset id="positionField"><legend>Eligible positions</legend><div id="positions" class="positions"></div></fieldset><div id="notice" class="notice" aria-live="polite"></div><div class="actions"><button type="button" id="cancel" class="btn secondary">Cancel</button><button type="button" id="undo" class="btn danger">Undo</button><button class="btn primary">Save</button></div></form></div>
<script>
(()=>{const TEAMS=['Luke','Jon','Tom','Mark','Jeff'],POS=['GK','LB','CB','RB','LM','CM','RM','LW','ST','RW'],BUDGET=500,KEY='football-draft-v3';
const CHEAT=[
['Lionel Messi','RW',1,'2100-2250'],['Cristiano Ronaldo','LW',2,'1800-1950'],['Alfredo Di Stefano','RW',3,'1450-1600'],['Gerd Muller','ST',4,'1300-1420'],['George Best','RW',5,'1150-1260'],['Marco van Basten','ST',6,'1120-1230'],['Johan Cruyff','LW',7,'1100-1200'],['Ronaldo Nazario','ST',8,'1050-1160'],['Robert Lewandowski','ST',9,'1020-1130'],['Michel Platini','CM',10,'1000-1100'],['Franz Beckenbauer','CB',11,'1000-1080'],['Ronaldinho','LW',12,'970-1050'],['Paco Gento','LM',13,'950-1050'],['Luis Suarez','ST',14,'930-1040'],['Lothar Matthaus','CM',15,'920-1000'],['Ryan Giggs','LM',16,'900-1000'],['Thomas Muller','RM',17,'880-970'],['Mohamed Salah','RW',18,'850-950'],['Sergio Ramos','CB',19,'850-940'],['Toni Kroos','CM',20,'830-910'],['Rivaldo','LW',21,'800-890'],['Paolo Maldini','LB',22,'800-880'],['Zinedine Zidane','CM',23,'790-870'],['Dani Alves','RB',24,'780-860'],['Luka Modric','CM',25,'770-850'],['Andres Iniesta','CM',26,'760-840'],['Franco Baresi','CB',27,'760-830'],['Marcelo','LB',28,'750-830'],['Luis Figo','RM',29,'740-820'],['Xavi','CM',30,'730-810'],['Philipp Lahm','RB',31,'720-790'],['Franck Ribery','LM',32,'710-790'],['Roberto Carlos','LB',33,'710-790'],['Arjen Robben','RM',34,'690-770'],['Gaetano Scirea','CB',35,'680-750'],['Cafu','RB',36,'660-730'],['Frank Lampard','CM',37,'650-730'],['David Beckham','RM',38,'650-730'],['Pavel Nedved','LM',39,'640-720'],['Manuel Neuer','GK',40,'650-720'],['Javier Zanetti','RB',41,'620-690'],['Ashley Cole','LB',42,'630-700'],['Paul Scholes','CM',43,'600-680'],['Iker Casillas','GK',44,'610-680'],['Neymar','LW',45,'590-680'],['Gerard Pique','CB',46,'580-660'],['Sepp Maier','GK',47,'570-640'],['Bixente Lizarazu','LB',48,'560-630'],['Giuseppe Bergomi','RB',49,'550-620'],['Gianluigi Buffon','GK',50,'540-610']];const F={'4-4-2':{GK:1,LB:1,CB:2,RB:1,LM:1,CM:2,RM:1,ST:2},'4-3-3':{GK:1,LB:1,CB:2,RB:1,CM:3,LW:1,ST:1,RW:1},'4-5-1':{GK:1,LB:1,CB:2,RB:1,LM:1,CM:3,RM:1,ST:1},'3-4-3':{GK:1,LB:1,CB:1,RB:1,LM:1,CM:2,RM:1,LW:1,ST:1,RW:1},'3-5-2':{GK:1,LB:1,CB:1,RB:1,LM:1,CM:3,RM:1,ST:2},'5-3-2':{GK:1,LB:1,CB:3,RB:1,CM:3,ST:2},'5-4-1':{GK:1,LB:1,CB:3,RB:1,LM:1,CM:2,RM:1,ST:1}};let state={purchases:[],selected:'Luke',tab:'squad',nextId:1,cheatQ:'',cheatFilter:'all'};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'£'+n+'m';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function rows(t){return state.purchases.filter(x=>x.team===t)}function players(t){return rows(t).filter(x=>x.type==='player')}function spent(t){return rows(t).reduce((s,x)=>s+x.price,0)}function left(t){return BUDGET-spent(t)}function vacancies(t){return Math.max(0,12-rows(t).length)}function maxBid(t){return Math.max(0,left(t)-Math.max(0,vacancies(t)-1))}
function matchCount(ps,req){const slots=[];Object.entries(req).forEach(([p,n])=>{for(let i=0;i<n;i++)slots.push(p)});let best=0,used=new Set();slots.sort((a,b)=>ps.filter(x=>x.positions.includes(a)).length-ps.filter(x=>x.positions.includes(b)).length);function go(i,c){if(i===slots.length){best=Math.max(best,c);return}go(i+1,c);for(let j=0;j<ps.length;j++)if(!used.has(j)&&ps[j].positions.includes(slots[i])){used.add(j);go(i+1,c+1);used.delete(j)}}go(0,0);return best}function formations(t,complete){const ps=players(t),empty=Math.max(0,11-ps.length);return Object.entries(F).filter(([n,r])=>{const need=Object.values(r).reduce((a,b)=>a+b,0),m=matchCount(ps,r);return complete?m===need:need-m<=empty}).map(x=>x[0])}
function renderCards(){$('#cards').innerHTML=TEAMS.map(t=>`<button class="card team-card ${t===state.selected?'active':''}" data-team="${t}"><div class="team-name">${t}</div><div class="money">${money(left(t))}</div><div class="small">${money(spent(t))} spent · ${rows(t).length}/12</div></button>`).join('');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.team;save();render()})}
function squad(){const t=state.selected,rs=rows(t),now=formations(t,true),possible=formations(t,false);return `<section class="panel"><h2>${t}'s squad</h2><div class="metrics"><div class="metric"><span class="small">Remaining</span><b>${money(left(t))}</b></div><div class="metric"><span class="small">Max bid</span><b>${money(maxBid(t))}</b></div><div class="metric"><span class="small">Places</span><b>${rs.length}/12</b></div></div><h2 style="margin-top:14px">Formations</h2><div class="small">Playable now</div><div class="pills">${now.length?now.map(x=>`<span class="pill">${x}</span>`).join(''):'<span class="small">No complete XI yet</span>'}</div><div class="small" style="margin-top:8px">Still possible</div><div class="pills">${possible.length?possible.map(x=>`<span class="pill">${x}</span>`).join(''):'<span class="bad">No valid formation remains</span>'}</div><div class="scroll"><table><thead><tr><th>Name</th><th>Round</th><th>Price</th><th></th></tr></thead><tbody>${rs.length?rs.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="small">${x.type==='manager'?'Manager':x.positions.join(', ')}</div></td><td>${x.round}</td><td>${money(x.price)}</td><td><button class="btn danger del" data-id="${x.id}">×</button></td></tr>`).join(''):'<tr><td colspan="4">No purchases yet.</td></tr>'}</tbody></table></div></section>`}
function rounds(){let rr=[...new Set(state.purchases.map(x=>x.round))].sort((a,b)=>a-b),cum=Object.fromEntries(TEAMS.map(t=>[t,0]));return `<section class="panel"><h2>Round spending</h2><div class="scroll"><table><thead><tr><th>Round</th>${TEAMS.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rr.length?rr.map(r=>{let cells=TEAMS.map(t=>{let v=state.purchases.filter(x=>x.round===r&&x.team===t).reduce((s,x)=>s+x.price,0);cum[t]+=v;return `<td><b>${money(v)}</b><div class="small">${money(BUDGET-cum[t])} left</div></td>`}).join('');return `<tr><td><b>${r}</b></td>${cells}</tr>`}).join(''):'<tr><td>No rounds recorded.</td></tr>'}</tbody></table></div></section>`}
function log(){return `<section class="panel"><h2>All purchases</h2><div class="scroll"><table><thead><tr><th>R</th><th>Team</th><th>Name</th><th>Price</th></tr></thead><tbody>${[...state.purchases].sort((a,b)=>a.round-b.round||a.id-b.id).map(x=>`<tr><td>${x.round}</td><td>${x.team}</td><td><b>${esc(x.name)}</b><div class="small">${x.type==='manager'?'Manager':x.positions.join(', ')}</div></td><td>${money(x.price)}</td></tr>`).join('')||'<tr><td colspan="4">No purchases yet.</td></tr>'}</tbody></table></div></section>`}
function cheat(){const sold=new Map(state.purchases.map(x=>[x.name.toLowerCase(),x]));let filter=state.cheatFilter||'all';let q=(state.cheatQ||'').toLowerCase();let list=CHEAT.filter(x=>(filter==='all'||x[1]===filter)&&(!q||x[0].toLowerCase().includes(q)));return `<section class="panel"><h2>My 50-player cheat sheet</h2><div class="small">Sold players update automatically. Use Buy for a listed player, or + Any purchase for someone not on this list.</div><div class="grid2" style="margin-top:10px"><input id="cheatQ" placeholder="Search player" value="${esc(state.cheatQ||'')}"><select id="cheatFilter"><option value="all">All positions</option>${POS.map(p=>`<option ${filter===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="scroll" style="margin-top:8px"><table><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Est. pts</th><th>Status</th><th></th></tr></thead><tbody>${list.map(x=>{let a=sold.get(x[0].toLowerCase());return `<tr class="cheat-row ${a?'sold':''}"><td><b>${x[2]}</b></td><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[3]}</td><td>${a?`<span class="status soldtag">SOLD</span><div class="small">${a.team} · ${money(a.price)} · R${a.round}</div>`:'<span class="status available">AVAILABLE</span>'}</td><td>${a?'':`<button class="btn primary cheatbuy" data-name="${x[0]}" data-pos="${x[1]}">Buy</button>`}</td></tr>`}).join('')}</tbody></table></div></section>`}
function bindCheat(){let q=$('#cheatQ'),f=$('#cheatFilter');if(q)q.oninput=()=>{state.cheatQ=q.value;save();render()};if(f)f.onchange=()=>{state.cheatFilter=f.value;save();render()};document.querySelectorAll('.cheatbuy').forEach(b=>b.onclick=()=>{$('#name').value=b.dataset.name;$('#type').value='player';$('#positionField').classList.remove('hide');document.querySelectorAll('#positions input').forEach(x=>x.checked=x.value===b.dataset.pos);$('#team').value=state.selected;$('#modal').classList.add('open')})}
function render(){renderCards();document.querySelectorAll('[data-tab]').forEach(b=>{b.className='btn '+(b.dataset.tab===state.tab?'primary':'secondary');b.onclick=()=>{state.tab=b.dataset.tab;save();render()}});$('#content').innerHTML=state.tab==='squad'?squad():state.tab==='rounds'?rounds():state.tab==='cheat'?cheat():log();if(state.tab==='cheat')bindCheat();document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{state.purchases=state.purchases.filter(x=>x.id!==+b.dataset.id);save();render()})}
$('#team').innerHTML=TEAMS.map(t=>`<option>${t}</option>`).join('');$('#positions').innerHTML=POS.map(p=>`<label class="pos"><input type="checkbox" value="${p}"> ${p}</label>`).join('');$('#add').onclick=()=>{$('#team').value=state.selected;$('#modal').classList.add('open')};$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#type').onchange=()=>$('#positionField').classList.toggle('hide',$('#type').value==='manager');$('#undo').onclick=()=>{state.purchases.pop();save();render();$('#modal').classList.remove('open')};$('#form').onsubmit=e=>{e.preventDefault();let team=$('#team').value,name=$('#name').value.trim(),type=$('#type').value,price=+$('#price').value,round=+$('#round').value,pos=[...document.querySelectorAll('#positions input:checked')].map(x=>x.value),n=$('#notice');n.textContent='';n.className='notice';if(!name||price<1||round<1){n.textContent='Enter a valid name, round and price.';n.classList.add('bad');return}if(type==='player'&&!pos.length){n.textContent='Select at least one position.';n.classList.add('bad');return}if(rows(team).length>=12){n.textContent='Squad already has 12 members.';n.classList.add('bad');return}if(type==='manager'&&rows(team).some(x=>x.type==='manager')){n.textContent='This team already has a manager.';n.classList.add('bad');return}if(price>maxBid(team)){n.textContent=`Maximum legal bid is ${money(maxBid(team))}.`;n.classList.add('bad');return}if(state.purchases.some(x=>x.name.toLowerCase()===name.toLowerCase())){n.textContent='That person has already been bought.';n.classList.add('bad');return}state.purchases.push({id:state.nextId++,team,name,type,price,round,positions:type==='player'?pos:[]});state.selected=team;save();e.target.reset();$('#round').value=round;$('#positionField').classList.remove('hide');$('#modal').classList.remove('open');render()};
$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='football-draft-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.purchases))throw 0;state={...state,...x};save();render()}catch{alert('Invalid backup file.')}};$('#reset').onclick=()=>{if(confirm('Delete the whole draft?')){state={purchases:[],selected:'Luke',tab:'squad',nextId:1,cheatQ:'',cheatFilter:'all'};save();render()}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();})();
</script></body></html>
