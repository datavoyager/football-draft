</style></head><body><header><h1>⚽ All-Time Football Draft</h1><div class="small" style="color:#cbd5e1">Configurable players · uploadable cheat sheet · £500m each</div></header><main class="wrap"><div id="cards" class="cards"></div><div class="tabs"><button class="btn grey tab" data-tab="squad">Squad</button><button class="btn grey tab" data-tab="rounds">Rounds</button><button class="btn grey tab" data-tab="cheat">Cheat Sheet</button><button class="btn grey tab" data-tab="setup">Setup</button></div><div id="view"></div></main><button id="add" class="btn blue fab">+ Any purchase</button><div id="transferModal" class="modal"><form id="transferForm" class="sheet"><h2>Resale / transfer</h2><div class="small">Buyer pays the winning bid. Seller receives the lower of the winning bid or 90% of the original purchase price.</div><input id="transferId" type="hidden"><div class="field"><label>Player<input id="transferName" readonly></label></div><div class="grid2"><label>From<input id="transferFrom" readonly></label><label>Buyer<select id="transferBuyer"></select></label></div><div class="grid2 field"><label>Resale window<select id="transferWindow"><option value="3">After round 3</option><option value="6">After round 6</option><option value="9">After round 9</option></select></label><label>Winning bid (£m)<input id="transferPrice" type="number" min="1" required></label></div><div id="transferPreview" class="small"></div><div id="transferMsg" class="small"></div><div class="actions"><button type="button" id="transferCancel" class="btn grey">Cancel</button><button class="btn blue">Complete resale</button></div></form></div><div id="modal" class="modal"><form id="form" class="sheet"><h2>Record purchase</h2><div class="grid2"><label>Draft player<select id="team"></select></label><label>Round<input id="round" type="number" min="1" value="1"></label></div><div class="field"><label>Player / manager<input id="name" required></label></div><div class="grid2"><label>Type<select id="type"> (()=>{const POS=['GK','LB','CB','RB','LM','CM','RM','LW','ST','RW'],KEY='draft-v5';let state={teams:['Luke','Jon','Tom','Mark','Jeff'],purchases:[],transfers:[],cheat:DEFAULT_CHEAT,selected:'Luke',tab:'cheat',nextId:1};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const $=s=>document.querySelector(s),money=n=>'£'+n+'m',save=()=>localStorage.setItem(KEY,JSON.stringify(state)),baseSpend=t=>state.purchases.filter(x=>(x.originalTeam||x.team)===t).reduce((a,b)=>a+(b.originalPrice||b.price),0),transferBuys=t=>(state.transfers||[]).filter(x=>x.buyer===t).reduce((a,b)=>a+b.price,0),transferCredits=t=>(state.transfers||[]).filter(x=>x.seller===t).reduce((a,b)=>a+b.credit,0),spent=t=>baseSpend(t)+transferBuys(t)-transferCredits(t),left=t=>500-spent(t),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cards(){$('#cards').innerHTML=state.teams.map(t=>`<button class="card team ${t===state.selected?'active':''}" data-team="${esc(t)}"><b>${esc(t)}</b><div class="money">${money(left(t))}</div><div class="small">${money(spent(t))} spent</div></button>`).join('');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.team;save();render()})}
function squad(){let a=state.purchases.filter(x=>x.team===state.selected);return `<section class="panel"><h2>${esc(state.selected)}'s squad</h2><b>${money(left(state.selected))} left</b><div class="small">Net spent ${money(spent(state.selected))}; resale credits are included.</div><div class="scroll"><table>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="small">${x.type==='manager'?'Manager':x.positions.join(', ')} · originally ${money(x.originalPrice||x.price)}</div></td><td>R${x.round}</td><td>${money(x.price)}</td><td><div class="actions">${x.type==='player'?`<button class="btn grey transfer" data-id="${x.id}">Resale</button>`:''}<button class="btn red del" data-id="${x.id}">Delete</button></div></td></tr>`).join('')||'<tr><td>No purchases.</td></tr>'}</table></div></section>`}
function rounds(){let rr=[...new Set(state.purchases.map(x=>x.round))].sort((a,b)=>a-b),cum=Object.fromEntries(state.teams.map(t=>[t,0]));return `<section class="panel"><h2>Round spending</h2><div class="scroll"><table><tr><th>R</th>${state.teams.map(t=>`<th>${esc(t)}</th>`).join('')}</tr>${rr.map(r=>`<tr><td>${r}</td>${state.teams.map(t=>{let v=state.purchases.filter(x=>(x.originalTeam||x.team)===t&&x.round===r).reduce((a,b)=>a+(b.originalPrice||b.price),0);cum[t]+=v;return `<td><b>${money(v)}</b><div class="small">Initial auction spend</div></td>`}).join('')}</tr>`).join('')||'<tr><td>No rounds.</td></tr>'}</table></div></section><section class="panel"><h2>Resales / transfers</h2><div class="scroll"><table><tr><th>Window</th><th>Player</th><th>Seller</th><th>Buyer paid</th><th>Seller received</th></tr>${(state.transfers||[]).map(x=>`<tr><td>After R${x.window}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.seller)}</td><td>${esc(x.buyer)} · ${money(x.price)}</td><td>${money(x.credit)}</td></tr>`).join('')||'<tr><td colspan="5">No resales.</td></tr>'}</table></div></section>`}
function cheat(){let sold=new Map(state.purchases.map(x=>[x.name.toLowerCase(),x]));return `<section class="panel"><h2>Cheat sheet (${state.cheat.length})</h2><div class="small">The list is configurable under Setup. Sold status updates from purchases.</div><div class="scroll"><table><tr><th>#</th><th>Player</th><th>Pos</th><th>Pts</th><th>Status</th><th></th></tr>${state.cheat.sort((a,b)=>a.rank-b.rank).map(x=>{let s=sold.get(x.name.toLowerCase());return `<tr><td>${x.rank||''}</td><td><b>${esc(x.name)}</b></td><td>${x.position}</td><td>${esc(x.points||'')}</td><td>${s?`<span class="status sold">SOLD</span><div class="small">${esc(s.team)} · ${money(s.price)} · R${s.round}</div>`:'<span class="status avail">AVAILABLE</span>'}</td><td>${s?'':`<button class="btn blue buy" data-name="${esc(x.name)}" data-pos="${x.position}">Buy</button>`}</td></tr>`}).join('')}</table></div></section>`}
function setup(){return `<section class="panel"><h2>Draft players</h2><label>Number of people<input id="count" type="number" min="2" max="20" value="${state.teams.length}"></label><div id="names">${state.teams.map((t,i)=>`<div class="field"><label>Player ${i+1}<input class="pname" value="${esc(t)}"></label></div>`).join('')}</div><button id="saveplayers" class="btn blue">Save names</button></section><section class="panel"><h2>Cheat sheet</h2><div class="small">Paste one per line: <b>Name,Position,Rank,Estimated points</b>. Or upload CSV/JSON.</div><textarea id="ctext" rows="7" placeholder="Lionel Messi,RW,1,2100-2250"></textarea><div class="actions"><button id="apply" class="btn blue">Replace from text</button><button id="upload" class="btn grey">Upload CSV/JSON</button><button id="restore" class="btn grey">Restore default 50</button></div><input id="cfile" class="hide" type="file" accept=".csv,.json,text/csv,application/json"></section>`}
const parse=t=>t.split(/\r?\n/).map((l,i)=>l.trim()).filter(Boolean).map((l,i)=>{let a=l.split(',').map(x=>x.trim());return {name:a[0],position:(a[1]||'').toUpperCase(),rank:+a[2]||i+1,points:a[3]||''}}).filter(x=>x.name&&POS.includes(x.position));
function bind(){document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{let id=+b.dataset.id,p=state.purchases.find(x=>x.id===id);if(p&&confirm(`Delete ${p.name}? This also removes any linked resale history and recalculates all budgets.`)){state.purchases=state.purchases.filter(x=>x.id!==id);state.transfers=(state.transfers||[]).filter(x=>x.playerId!==id);save();render()}});document.querySelectorAll('.transfer').forEach(b=>b.onclick=()=>openTransfer(+b.dataset.id));document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>open(b.dataset.name,b.dataset.pos));if(state.tab==='setup'){let c=$('#count');c.onchange=()=>{let n=Math.max(2,Math.min(20,+c.value||5));state.teams=Array.from({length:n},(_,i)=>state.teams[i]||`Player ${i+1}`);save();render()};$('#saveplayers').onclick=()=>{let a=[...document.querySelectorAll('.pname')].map(x=>x.value.trim());if(a.some(x=>!x)||new Set(a.map(x=>x.toLowerCase())).size!==a.length)return alert('Enter unique names for every draft player.');state.teams=a;if(!a.includes(state.selected))state.selected=a[0];save();render()};$('#apply').onclick=()=>{let a=parse($('#ctext').value);if(!a.length)return alert('No valid rows.');state.cheat=a;state.tab='cheat';save();render()};$('#upload').onclick=()=>$('#cfile').click();$('#cfile').onchange=async e=>{try{let f=e.target.files[0],t=await f.text(),a;if(f.name.toLowerCase().endsWith('.json')){let j=JSON.parse(t);a=(Array.isArray(j)?j:j.cheat||[]).map((x,i)=>({name:x.name||x.player,position:String(x.position||x.pos||'').toUpperCase(),rank:+x.rank||i+1,points:x.points||x.estimatedPoints||''})).filter(x=>x.name&&POS.includes(x.position))}else a=parse(t);if(!a.length)throw 0;state.cheat=a;state.tab='cheat';save();render()}catch{alert('Invalid cheat sheet. Use CSV Name,Position,Rank,Estimated points or JSON array.')}};$('#restore').onclick=()=>{state.cheat=DEFAULT_CHEAT;state.tab='cheat';save();render()}}}
function openTransfer(id){let p=state.purchases.find(x=>x.id===id);if(!p)return;$('#transferId').value=id;$('#transferName').value=p.name;$('#transferFrom').value=p.team;$('#transferBuyer').innerHTML=state.teams.filter(t=>t!==p.team).map(t=>`<option>${esc(t)}</option>`).join('');$('#transferPrice').value='';$('#transferPreview').textContent=`Original price ${money(p.originalPrice||p.price)}; maximum seller receipt ${money(Math.floor((p.originalPrice||p.price)*0.9))}.`;$('#transferMsg').textContent='';$('#transferModal').classList.add('open')}
function render(){cards();$('#team').innerHTML=state.teams.map(t=>`<option>${esc(t)}</option>`).join('');document.querySelectorAll('.tab').forEach(b=>{const active=b.dataset.tab===state.tab;b.className='btn tab';b.setAttribute('aria-selected',active?'true':'false');b.onclick=()=>{state.tab=b.dataset.tab;save();render()}});$('#view').innerHTML=state.tab==='squad'?squad():state.tab==='rounds'?rounds():state.tab==='setup'?setup():cheat();bind()}
function open(name='',pos=''){$('#team').value=state.selected;$('#name').value=name;$('#type').value='player';$('#pf').classList.remove('hide');document.querySelectorAll('#positions input').forEach(x=>x.checked=x.value===pos);$('#modal').classList.add('open')}
$('#positions').innerHTML=POS.map(p=>`<label><input type="checkbox" value="${p}"> ${p}</label>`).join('');$('#add').onclick=()=>open();$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#type').onchange=()=>$('#pf').classList.toggle('hide',$('#type').value==='manager');$('#form').onsubmit=e=>{e.preventDefault();let team=$('#team').value,name=$('#name').value.trim(),type=$('#type').value,price=+$('#price').value,round=Math.max(1,+$('#round').value||1),positions=[...document.querySelectorAll('#positions input:checked')].map(x=>x.value);if(!name||price<1)return $('#msg').textContent='Enter name and valid price.';if(type==='player'&&!positions.length)return $('#msg').textContent='Select at least one position.';if(price>left(team))return $('#msg').textContent='Not enough budget.';if(state.purchases.some(x=>x.name.toLowerCase()===name.toLowerCase()))return $('#msg').textContent='Already bought.';state.purchases.push({id:state.nextId++,team,originalTeam:team,name,type,price,originalPrice:price,round,positions:type==='player'?positions:[]});state.selected=team;save();e.target.reset();$('#round').value=round;$('#modal').classList.remove('open');render()};$('#transferCancel').onclick=()=>$('#transferModal').classList.remove('open');$('#transferForm').onsubmit=e=>{e.preventDefault();let id=+$('#transferId').value,p=state.purchases.find(x=>x.id===id),buyer=$('#transferBuyer').value,price=+$('#transferPrice').value,window=+$('#transferWindow').value;if(!p||!buyer||price<1)return $('#transferMsg').textContent='Enter a valid buyer and winning bid.';if(price>left(buyer))return $('#transferMsg').textContent=`${buyer} only has ${money(left(buyer))} available.`;let seller=p.team,credit=Math.min(price,Math.floor((p.originalPrice||p.price)*0.9));state.transfers=state.transfers||[];state.transfers.push({id:Date.now(),playerId:id,name:p.name,seller,buyer,price,credit,window});p.team=buyer;p.price=price;state.selected=buyer;save();$('#transferModal').classList.remove('open');
